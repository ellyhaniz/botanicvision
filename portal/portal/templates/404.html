{% extends "portal/base.html" %}
{% block title %}Page not found · PlantDex{% endblock %}
{% block content %}
<div class="card empty">
  <h1>404 · Page not found</h1>
  <p>That page does not exist, or the record was removed.</p>

</div>
{% endblock %}
