services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # SQL Server has no arm64 image; Docker Desktop emulates this on Apple Silicon.
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PlantDex!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build: .
    environment:
      DB_SERVER: "db"
      DB_NAME: "PlantDexDB"
      PLANTNET_API_KEY: "${PLANTNET_API_KEY}"
      DB_USER: "sa"
      DB_PASSWORD: "PlantDex!2026"
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  sqlserver_data:
